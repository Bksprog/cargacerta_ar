name: Testes e demo web (GitHub Pages)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Gera só o que falta (pasta web/ com ícones). Não sobrescreve lib/ nem pubspec.
      - name: Gerar plataforma web
        run: flutter create --platforms=web --project-name cargacerta_ar .

      # Garante que o create não alterou nada versionado (ex.: widget_test.dart).
      - name: Restaurar arquivos do projeto
        run: git checkout -- lib test pubspec.yaml analysis_options.yaml web/index.html web/manifest.json

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      - name: Build web (sem CDN: tudo é servido do próprio domínio)
        run: >
          flutter build web --release --no-web-resources-cdn
          --base-href "/${{ github.event.repository.name }}/"

      - name: Preparar publicação
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
